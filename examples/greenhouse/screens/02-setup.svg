<svg xmlns="http://www.w3.org/2000/svg" width="240" height="320" viewBox="0 0 240 320" role="img" aria-label="Setup"><rect width="240" height="320" fill="#000000"/><rect x="0" y="0" width="240" height="320" rx="0" fill="#FFFFFF" fill-opacity="1"/><g transform="translate(0,0)"><g transform="translate(0,0)"><rect x="0" y="0" width="240" height="44" rx="0" fill="#37474F" fill-opacity="1"/><g transform="translate(0,0)"><g transform="translate(0,11)"><text x="120" y="11" font-family="&#39;LW Montserrat&#39;, Montserrat, -apple-system,&#39;Segoe UI&#39;,Roboto,sans-serif" font-size="18" fill="#FFFFFF" fill-opacity="1" text-anchor="middle" dominant-baseline="middle" font-weight="500">Settings</text></g></g></g><g transform="translate(16,58)"><text x="104" y="8" font-family="&#39;LW Montserrat&#39;, Montserrat, -apple-system,&#39;Segoe UI&#39;,Roboto,sans-serif" font-size="12" fill="#757575" fill-opacity="1" text-anchor="middle" dominant-baseline="middle" font-weight="500">Water below this moisture</text></g><g transform="translate(16,80)"><rect x="0" y="0" width="208" height="20" rx="10" fill="#E0E0E0" fill-opacity="1"/><rect x="0" y="0" width="91" height="20" rx="10" fill="#2196F3" fill-opacity="1"/><rect x="78" y="-3" width="26" height="26" rx="13" fill="#2196F3" fill-opacity="1"/></g><g transform="translate(16,106)"><text x="104" y="13" font-family="&#39;LW Montserrat&#39;, Montserrat, -apple-system,&#39;Segoe UI&#39;,Roboto,sans-serif" font-size="22" fill="#2E7D32" fill-opacity="1" text-anchor="middle" dominant-baseline="middle" font-weight="500">45 %</text></g><g transform="translate(16,150)"><text x="0" y="10" font-family="&#39;LW Montserrat&#39;, Montserrat, -apple-system,&#39;Segoe UI&#39;,Roboto,sans-serif" font-size="16" fill="#212121" fill-opacity="1" text-anchor="start" dominant-baseline="middle" font-weight="500">Automatic</text></g><g transform="translate(162,145)"><rect x="0" y="0" width="62" height="30" rx="15" fill="#E0E0E0" fill-opacity="1"/><rect x="0" y="0" width="62" height="30" rx="15" fill="#2196F3" fill-opacity="1"/><rect x="34" y="2" width="26" height="26" rx="13" fill="#FFFFFF" fill-opacity="1"/></g><g transform="translate(16,188)"><text x="104" y="8" font-family="&#39;LW Montserrat&#39;, Montserrat, -apple-system,&#39;Segoe UI&#39;,Roboto,sans-serif" font-size="12" fill="#757575" fill-opacity="1" text-anchor="middle" dominant-baseline="middle" font-weight="500">Lockout left</text></g><g transform="translate(16,208)"><rect x="0" y="0" width="208" height="14" rx="7" fill="#E0E0E0" fill-opacity="1"/></g><g transform="translate(16,222)"><text x="0" y="8" font-family="&#39;LW Montserrat&#39;, Montserrat, -apple-system,&#39;Segoe UI&#39;,Roboto,sans-serif" font-size="12" fill="#757575" fill-opacity="1" text-anchor="start" dominant-baseline="middle" font-weight="500">The pump runs 8 s then waits 15</text><text x="0" y="24" font-family="&#39;LW Montserrat&#39;, Montserrat, -apple-system,&#39;Segoe UI&#39;,Roboto,sans-serif" font-size="12" fill="#757575" fill-opacity="1" text-anchor="start" dominant-baseline="middle" font-weight="500">min, whatever the probe says - a</text><text x="0" y="40" font-family="&#39;LW Montserrat&#39;, Montserrat, -apple-system,&#39;Segoe UI&#39;,Roboto,sans-serif" font-size="12" fill="#757575" fill-opacity="1" text-anchor="start" dominant-baseline="middle" font-weight="500">fallen sensor reads dry forever.</text></g><g transform="translate(16,278)"><rect x="0" y="0" width="208" height="36" rx="8" fill="#1565C0" fill-opacity="1"/><text x="104" y="18" font-family="&#39;LW Montserrat&#39;, Montserrat, -apple-system,&#39;Segoe UI&#39;,Roboto,sans-serif" font-size="14" fill="#FFFFFF" fill-opacity="1" text-anchor="middle" dominant-baseline="middle" font-weight="500">Back</text></g></g></svg>