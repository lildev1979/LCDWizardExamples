<svg xmlns="http://www.w3.org/2000/svg" width="240" height="320" viewBox="0 0 240 320" role="img" aria-label="Settings"><rect width="240" height="320" fill="#000000"/><rect x="0" y="0" width="240" height="320" rx="0" fill="#FFFFFF" fill-opacity="1"/><g transform="translate(0,0)"><g transform="translate(0,0)"><rect x="0" y="0" width="240" height="44" rx="0" fill="#37474F" fill-opacity="1"/><g transform="translate(0,0)"><g transform="translate(0,11)"><text x="120" y="11" font-family="&#39;LW Montserrat&#39;, Montserrat, -apple-system,&#39;Segoe UI&#39;,Roboto,sans-serif" font-size="18" fill="#FFFFFF" fill-opacity="1" text-anchor="middle" dominant-baseline="middle" font-weight="500">Settings</text></g></g></g><g transform="translate(16,58)"><text x="104" y="8" font-family="&#39;LW Montserrat&#39;, Montserrat, -apple-system,&#39;Segoe UI&#39;,Roboto,sans-serif" font-size="12" fill="#757575" fill-opacity="1" text-anchor="middle" dominant-baseline="middle" font-weight="500">Boost left</text></g><g transform="translate(16,80)"><rect x="0" y="0" width="208" height="16" rx="8" fill="#E0E0E0" fill-opacity="1"/></g><g transform="translate(16,102)"><text x="104" y="12" font-family="&#39;LW Montserrat&#39;, Montserrat, -apple-system,&#39;Segoe UI&#39;,Roboto,sans-serif" font-size="20" fill="#EF6C00" fill-opacity="1" text-anchor="middle" dominant-baseline="middle" font-weight="500">0 min</text></g><g transform="translate(16,136)"><rect x="0" y="0" width="208" height="36" rx="8" fill="#FFFFFF" fill-opacity="1"/><rect x="0.5" y="0.5" width="207" height="35" rx="7.5" fill="none" stroke="#BDBDBD" stroke-opacity="1" stroke-width="1"/><text x="104" y="18" font-family="&#39;LW Montserrat&#39;, Montserrat, -apple-system,&#39;Segoe UI&#39;,Roboto,sans-serif" font-size="14" fill="#212121" fill-opacity="1" text-anchor="middle" dominant-baseline="middle" font-weight="500">Cancel boost</text></g><g transform="translate(16,186)"><text x="0" y="8" font-family="&#39;LW Montserrat&#39;, Montserrat, -apple-system,&#39;Segoe UI&#39;,Roboto,sans-serif" font-size="12" fill="#757575" fill-opacity="1" text-anchor="start" dominant-baseline="middle" font-weight="500">Heat comes on 0.3 C below the</text><text x="0" y="24" font-family="&#39;LW Montserrat&#39;, Montserrat, -apple-system,&#39;Segoe UI&#39;,Roboto,sans-serif" font-size="12" fill="#757575" fill-opacity="1" text-anchor="start" dominant-baseline="middle" font-weight="500">target and off 0.2 C above it, so the</text><text x="0" y="40" font-family="&#39;LW Montserrat&#39;, Montserrat, -apple-system,&#39;Segoe UI&#39;,Roboto,sans-serif" font-size="12" fill="#757575" fill-opacity="1" text-anchor="start" dominant-baseline="middle" font-weight="500">relay does not chatter. Boost adds 2</text><text x="0" y="56" font-family="&#39;LW Montserrat&#39;, Montserrat, -apple-system,&#39;Segoe UI&#39;,Roboto,sans-serif" font-size="12" fill="#757575" fill-opacity="1" text-anchor="start" dominant-baseline="middle" font-weight="500">C for half an hour.</text></g><g transform="translate(16,276)"><rect x="0" y="0" width="208" height="36" rx="8" fill="#1565C0" fill-opacity="1"/><text x="104" y="18" font-family="&#39;LW Montserrat&#39;, Montserrat, -apple-system,&#39;Segoe UI&#39;,Roboto,sans-serif" font-size="14" fill="#FFFFFF" fill-opacity="1" text-anchor="middle" dominant-baseline="middle" font-weight="500">Back</text></g></g></svg>